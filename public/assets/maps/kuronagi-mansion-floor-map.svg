<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">黒凪館 内部地図</title>
  <desc id="desc">黒凪館の地下、1階、2階の部屋と階段、正面玄関、裏口を示す見取図</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#222c28" stroke-width="1"/></pattern>
    <style>.wall{fill:#111815;stroke:#91a39a;stroke-width:4}.inner{fill:none;stroke:#62736b;stroke-width:3}.door{fill:none;stroke:#d2ddd7;stroke-width:5}.label{font-family:'Yu Gothic',sans-serif;fill:#d7e0db;font-size:22px;text-anchor:middle}.small{font-family:monospace;fill:#899b92;font-size:15px;letter-spacing:2px}.floor{font-family:monospace;fill:#bac9c1;font-size:24px;letter-spacing:3px}.stairs{stroke:#6f8278;stroke-width:2}.exit{fill:#aabdb3;font-family:'Yu Gothic',sans-serif;font-size:16px}</style>
  </defs>
  <rect width="1200" height="900" fill="#090e0c"/><rect x="20" y="20" width="1160" height="860" fill="url(#grid)" stroke="#435149"/>
  <text x="55" y="65" class="small">KUZE P.I. DATABASE / ARCHITECTURAL FILE 02</text><text x="55" y="108" class="floor">黒凪館　館内見取図</text>
  <g transform="translate(55 165)"><text class="floor" x="0" y="-18">2F</text><rect class="wall" x="100" y="0" width="930" height="180"/><path class="inner" d="M300 0v180M500 0v180M700 0v180M880 0v180M100 112h930"/><text class="label" x="200" y="67">客室 201</text><text class="label" x="400" y="67">客室 202</text><text class="label" x="600" y="67">客室 203</text><text class="label" x="790" y="67">客室 204</text><text class="label" x="955" y="67">階段</text><text class="small" x="456" y="154">2F CORRIDOR</text><g class="stairs"><path d="M900 18h110M900 32h110M900 46h110M900 60h110M900 74h110M900 88h110"/></g></g>
  <g transform="translate(55 425)"><text class="floor" x="0" y="-18">1F</text><rect class="wall" x="100" y="0" width="930" height="240"/><path class="inner" d="M340 0v240M610 0v240M820 0v240M100 142h930"/><text class="label" x="220" y="74">応接室</text><text class="label" x="475" y="74">食堂</text><text class="label" x="715" y="74">書斎</text><text class="label" x="925" y="74">階段</text><text class="label" x="225" y="199">玄関ホール</text><text class="label" x="475" y="199">厨房</text><text class="label" x="715" y="199">廊下</text><text class="label" x="925" y="199">裏口</text><path class="door" d="M190 240h65M930 240h65"/><text class="exit" x="181" y="272">正面玄関</text><text class="exit" x="916" y="272">林・入り江へ</text><g class="stairs"><path d="M845 18h150M845 36h150M845 54h150M845 72h150M845 90h150M845 108h150"/></g></g>
  <g transform="translate(55 765)"><text class="floor" x="0" y="-18">B1</text><rect class="wall" x="100" y="0" width="930" height="90"/><path class="inner" d="M760 0v90"/><text class="label" x="430" y="54">旧貯蔵庫</text><text class="label" x="895" y="54">地下階段</text><g class="stairs"><path d="M785 16h220M785 30h220M785 44h220M785 58h220M785 72h220"/></g></g>
</svg>
