<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">黒凪館 館内見取図 詳細版</title>
  <desc id="desc">黒凪館の地下、1階、2階について壁、扉、窓、階段、廊下、主要室、出入口、事件関連地点を示す詳細な建築図面</desc>
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#202c27" stroke-width="1"/></pattern>
    <pattern id="stone" width="18" height="12" patternUnits="userSpaceOnUse"><path d="M0 0h18M0 12h18M9 0v6M3 6v6" fill="none" stroke="#384a41" stroke-width="1"/></pattern>
    <style>
      .jp{font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;fill:#dce5e0}.mono{font-family:monospace;fill:#8fa198;letter-spacing:2px}.heading{font-size:34px;font-weight:600}.floorname{font-size:25px;font-weight:600}.room{font-size:19px;text-anchor:middle}.sub{font-size:13px;text-anchor:middle}.wall{fill:#101814;stroke:#afbeb6;stroke-width:8}.partition{fill:none;stroke:#82958b;stroke-width:5}.thin{fill:none;stroke:#53675d;stroke-width:2}.door{fill:none;stroke:#d7e1dc;stroke-width:3}.window{stroke:#83a99a;stroke-width:7}.stair{stroke:#75897e;stroke-width:2}.site{fill:#bba36d;stroke:#09100d;stroke-width:3}.marker{font-family:monospace;fill:#f0e2b7;font-size:13px;font-weight:bold;text-anchor:middle}.note{font-size:13px}.box{fill:#0b120f;stroke:#4c6056;stroke-width:2}.route{fill:none;stroke:#adbdB5;stroke-width:3;stroke-dasharray:8 7}
    </style>
  </defs>
